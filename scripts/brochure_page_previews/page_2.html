<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="utf-8">
  <title>Ai Smart Model — City Scale Sales Brochure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page {
      size: 297mm 210mm;
      margin: 0;
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 297mm;
      height: auto;
      font-family: 'Cairo', 'Tajawal', sans-serif;
      background-color: #05141a;
      color: #ffffff;
      direction: rtl;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 297mm;
      height: 210mm;
      page-break-after: always;
      page-break-inside: avoid;
      position: relative;
      overflow: hidden;
      background: #091318;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
      box-sizing: border-box;
    }
    /* Brand Gradient Backgrounds */
    .bg-teal-gradient {
      background: linear-gradient(135deg, #001920 0%, #003744 40%, #005063 70%, #03151c 100%);
    }
    .bg-dark-slate {
      background: radial-gradient(circle at 80% 20%, #00313d 0%, #09141a 60%, #040a0d 100%);
    }
    /* Header Bar */
    .page-header {
      height: 64px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 217, 181, 0.2);
      background: rgba(4, 15, 20, 0.85);
      z-index: 20;
    }
    .page-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .page-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Footer Bar */
    .page-footer {
      height: 44px;
      padding: 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(4, 15, 20, 0.9);
      font-size: 11px;
      color: #7d9ba6;
      font-weight: 600;
      z-index: 20;
    }
    /* Body Content Container */
    .page-body {
      flex: 1;
      padding: 24px 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      position: relative;
    }
    /* Badges */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      background: rgba(0, 217, 181, 0.15);
      color: #00d9b5;
      border: 1px solid rgba(0, 217, 181, 0.35);
    }
    .pill-solid {
      background: #00d9b5;
      color: #03181f;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
    }
    /* Cards */
    .feature-card {
      background: rgba(10, 28, 36, 0.75);
      border: 1px solid rgba(0, 217, 181, 0.2);
      border-radius: 16px;
      padding: 16px 20px;
      backdrop-filter: blur(10px);
    }
    .screenshot-frame {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(0, 217, 181, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 217, 181, 0.15);
      background: #000;
      display: flex;
    }
    .screenshot-frame img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
  </style>
</head><body style="width:1440px;height:1018px;overflow:hidden;margin:0;padding:0;"><div class="page bg-dark-slate">
    
<svg width="100%" height="100%" style="position:absolute; inset:0; pointer-events:none; opacity:0.12;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cube-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M60 10 L110 38 L110 94 L60 122 L10 94 L10 38 Z" fill="none" stroke="#00d9b5" stroke-width="1.5"/>
      <path d="M60 10 L60 66 L110 94" fill="none" stroke="#00d9b5" stroke-width="1.5"/>
      <path d="M60 66 L10 94" fill="none" stroke="#00d9b5" stroke-width="1.5"/>
      <circle cx="60" cy="66" r="3" fill="#00d9b5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#cube-grid)"/>
</svg>


    <header class="page-header"></body></html>
