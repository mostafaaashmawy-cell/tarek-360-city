# Cloudflare Workers static assets & API proxy deployment for Tarek 360 City

name = "tarek-360-city"
main = "worker.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./out"

[[kv_namespaces]]
binding = "CITY360_KV"
